<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Træning">
<meta name="theme-color" content="#0d0d0d">
<title>Træning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --accent: #c8f135;
    --accent-dim: rgba(200,241,53,0.12);
    --text: #f0f0f0;
    --muted: #666;
    --danger: #ff4f4f;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
    padding-bottom: 6rem;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    padding: 3.5rem 1.5rem 1.5rem;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .header-top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 8px;
  }
  .header-date {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .header-title {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .vol-pill {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--accent-dim);
    color: var(--accent);
    padding: 6px 12px;
    border-radius: 100px;
    border: 1px solid rgba(200,241,53,0.25);
    white-space: nowrap;
    display: none;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 0;
    padding: 1rem 1.5rem 0;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 95px;
    background: var(--bg);
    z-index: 9;
  }
  .tab {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0 0 12px;
    margin-right: 1.5rem;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
  }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* Content */
  .page { display: none; padding: 1.5rem; }
  .page.active { display: block; }

  /* Log form */
  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1.25rem;
  }
  .form-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    display: block;
  }
  select, input[type="number"], input[type="text"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    padding: 12px 14px;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    transition: border-color 0.15s;
  }
  select:focus, input:focus {
    border-color: var(--accent);
  }
  .inputs-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-top: 1rem;
  }
  .inputs-grid input {
    text-align: center;
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 500;
    padding: 14px 8px;
  }
  .input-sublabel {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    margin-top: 4px;
    letter-spacing: 0.06em;
  }
  .add-btn {
    width: 100%;
    margin-top: 1rem;
    padding: 16px;
    background: var(--accent);
    color: #0d0d0d;
    border: none;
    border-radius: 10px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.1s, transform 0.1s;
  }
  .add-btn:active { opacity: 0.85; transform: scale(0.98); }

  /* Sets list */
  .sets-section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .sets-list { display: flex; flex-direction: column; gap: 8px; }
  .set-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideIn 0.2s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .set-idx {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    min-width: 22px;
  }
  .set-ex {
    flex: 1;
    font-size: 14px;
    font-weight: 400;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .set-stats {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    white-space: nowrap;
  }
  .del-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 4px;
    border-radius: 6px;
    transition: color 0.15s, background 0.15s;
  }
  .del-btn:hover { color: var(--danger); background: rgba(255,79,79,0.1); }

  .empty-state {
    text-align: center;
    padding: 3rem 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
  }
  .empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.4; }

  /* History page */
  .history-day {
    margin-bottom: 1.5rem;
  }
  .history-day-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .history-set {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  .history-set:last-child { border-bottom: none; }
  .history-stats {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
  }

  /* Stats page */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 1.25rem;
  }
  .stat-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
  }
  .stat-val {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 500;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-lbl {
    font-size: 12px;
    color: var(--muted);
  }
  .exercise-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .exercise-stat-name { font-size: 14px; }
  .exercise-stat-count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  /* Timer */
  .timer-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 100;
  }
  .timer-display {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 500;
    flex: 1;
    letter-spacing: 0.05em;
  }
  .timer-display.running { color: var(--accent); }
  .timer-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .timer-btn:active { background: var(--border); }
  .timer-btn.start { border-color: var(--accent); color: var(--accent); }

  /* Install banner */
  .install-banner {
    margin: 0 1.5rem 1.25rem;
    background: var(--accent-dim);
    border: 1px solid rgba(200,241,53,0.3);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    display: none;
  }
  .install-banner p { font-size: 13px; line-height: 1.5; color: var(--text); }
  .install-banner strong { color: var(--accent); }
  .install-close {
    float: right;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    margin-left: 8px;
    line-height: 1;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-date" id="header-date"></div>
  <div class="header-top">
    <h1 class="header-title">Træning</h1>
    <div class="vol-pill" id="vol-pill">0 kg</div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showPage('log')">Log</button>
  <button class="tab" onclick="showPage('history')">Historik</button>
  <button class="tab" onclick="showPage('stats')">Statistik</button>
</div>

<!-- Install banner -->
<div class="install-banner" id="install-banner">
  <button class="install-close" onclick="document.getElementById('install-banner').style.display='none'">×</button>
  <p><strong>Tilføj til hjemskærm</strong><br>
  iPhone: Tryk <strong>Del → Føj til hjemskærm</strong><br>
  Android: Tryk <strong>⋮ → Installer app</strong></p>
</div>

<!-- LOG -->
<div class="page active" id="page-log">
  <div class="form-card">
    <label class="form-label">Øvelse</label>
    <select id="exercise">
      <option>Bænkpres</option>
      <option>Squat</option>
      <option>Dødløft</option>
      <option>Skulderpres</option>
      <option>Pullups</option>
      <option>Bent-over rows</option>
      <option>Bicep curl</option>
      <option>Tricep pushdown</option>
      <option>Lunges</option>
      <option>Leg press</option>
      <option>Planke (sek)</option>
    </select>
    <div class="inputs-grid">
      <div>
        <input type="number" id="inp-sets" value="3" min="1" max="20">
        <div class="input-sublabel">Sæt</div>
      </div>
      <div>
        <input type="number" id="inp-reps" value="8" min="1" max="200">
        <div class="input-sublabel">Reps</div>
      </div>
      <div>
        <input type="number" id="inp-weight" value="60" min="0" max="500" step="2.5">
        <div class="input-sublabel">Kg</div>
      </div>
    </div>
    <button class="add-btn" onclick="addSet()">+ Tilføj sæt</button>
  </div>

  <div id="today-section">
    <div class="sets-section-label">Dagens sæt</div>
    <div class="sets-list" id="sets-list"></div>
    <div class="empty-state" id="empty-msg">
      <div class="empty-icon">🏋️</div>
      Ingen sæt logget endnu.<br>Tilføj dit første sæt ovenfor.
    </div>
  </div>
</div>

<!-- HISTORY -->
<div class="page" id="page-history">
  <div id="history-content">
    <div class="empty-state">
      <div class="empty-icon">📋</div>
      Ingen historik endnu.<br>Log dine første sæt!
    </div>
  </div>
</div>

<!-- STATS -->
<div class="page" id="page-stats">
  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-val" id="stat-sessions">0</div>
      <div class="stat-lbl">Træninger</div>
    </div>
    <div class="stat-box">
      <div class="stat-val" id="stat-total-sets">0</div>
      <div class="stat-lbl">Sæt i alt</div>
    </div>
    <div class="stat-box" style="grid-column: span 2;">
      <div class="stat-val" id="stat-total-vol">0</div>
      <div class="stat-lbl">Kg løftet i alt</div>
    </div>
  </div>
  <div class="sets-section-label">Mest trænede øvelser</div>
  <div id="exercise-stats"></div>
</div>

<!-- Timer -->
<div class="timer-bar">
  <div class="timer-display" id="timer-disp">0:00</div>
  <button class="timer-btn start" id="timer-btn" onclick="toggleTimer()">Start pause</button>
  <button class="timer-btn" onclick="resetTimer()">Nulstil</button>
</div>

<script>
// --- State ---
let sets = JSON.parse(localStorage.getItem('sets') || '[]');
let timerInterval = null;
let timerSeconds = 0;
let timerRunning = false;

// --- Date helpers ---
const DAYS = ['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag'];
const MONTHS = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function formatDate(key) {
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  return DAYS[dt.getDay()] + ' ' + d + '. ' + MONTHS[m-1] + ' ' + y;
}

// Header date
(function() {
  const d = new Date();
  document.getElementById('header-date').textContent =
    DAYS[d.getDay()] + ' ' + d.getDate() + '. ' + MONTHS[d.getMonth()];
})();

// --- Save ---
function save() { localStorage.setItem('sets', JSON.stringify(sets)); }

// --- Add set ---
function addSet() {
  const entry = {
    id: Date.now(),
    date: todayKey(),
    ex: document.getElementById('exercise').value,
    s: parseInt(document.getElementById('inp-sets').value) || 1,
    r: parseInt(document.getElementById('inp-reps').value) || 1,
    w: parseFloat(document.getElementById('inp-weight').value) || 0,
  };
  sets.push(entry);
  save();
  renderLog();
  renderHistory();
  renderStats();
  startTimer(); // auto-start rest timer
}

// --- Delete ---
function deleteSet(id) {
  sets = sets.filter(s => s.id !== id);
  save();
  renderLog();
  renderHistory();
  renderStats();
}

// --- Render log ---
function renderLog() {
  const today = sets.filter(s => s.date === todayKey());
  const list = document.getElementById('sets-list');
  const empty = document.getElementById('empty-msg');
  const volPill = document.getElementById('vol-pill');

  empty.style.display = today.length ? 'none' : 'block';
  list.innerHTML = today.map((s, i) => `
    <div class="set-row">
      <span class="set-idx">${String(i+1).padStart(2,'0')}</span>
      <span class="set-ex">${s.ex}</span>
      <span class="set-stats">${s.s}×${s.r} @ ${s.w}kg</span>
      <button class="del-btn" onclick="deleteSet(${s.id})" aria-label="Slet">×</button>
    </div>
  `).join('');

  const vol = today.reduce((acc, s) => acc + s.s * s.r * s.w, 0);
  if (today.length > 0) {
    volPill.style.display = 'block';
    volPill.textContent = Math.round(vol).toLocaleString('da-DK') + ' kg';
  } else {
    volPill.style.display = 'none';
  }
}

// --- Render history ---
function renderHistory() {
  const grouped = {};
  sets.forEach(s => {
    if (!grouped[s.date]) grouped[s.date] = [];
    grouped[s.date].push(s);
  });
  const keys = Object.keys(grouped).sort().reverse();
  const el = document.getElementById('history-content');
  if (!keys.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div>Ingen historik endnu.<br>Log dine første sæt!</div>';
    return;
  }
  el.innerHTML = keys.map(k => {
    const dayVol = grouped[k].reduce((a,s) => a + s.s*s.r*s.w, 0);
    return `<div class="history-day">
      <div class="history-day-label">${formatDate(k)} &nbsp;·&nbsp; ${Math.round(dayVol).toLocaleString('da-DK')} kg</div>
      ${grouped[k].map(s => `
        <div class="history-set">
          <span>${s.ex}</span>
          <span class="history-stats">${s.s}×${s.r} @ ${s.w}kg</span>
        </div>`).join('')}
    </div>`;
  }).join('');
}

// --- Render stats ---
function renderStats() {
  const sessions = new Set(sets.map(s => s.date)).size;
  const totalSets = sets.reduce((a,s) => a + s.s, 0);
  const totalVol = sets.reduce((a,s) => a + s.s*s.r*s.w, 0);
  document.getElementById('stat-sessions').textContent = sessions;
  document.getElementById('stat-total-sets').textContent = totalSets;
  document.getElementById('stat-total-vol').textContent = Math.round(totalVol).toLocaleString('da-DK');

  const exCount = {};
  sets.forEach(s => { exCount[s.ex] = (exCount[s.ex] || 0) + s.s; });
  const sorted = Object.entries(exCount).sort((a,b) => b[1]-a[1]);
  document.getElementById('exercise-stats').innerHTML = sorted.length
    ? sorted.map(([ex, cnt]) => `
        <div class="exercise-stat">
          <span class="exercise-stat-name">${ex}</span>
          <span class="exercise-stat-count">${cnt} sæt</span>
        </div>`).join('')
    : '<div class="empty-state" style="padding:1rem 0">Ingen data endnu</div>';
}

// --- Timer ---
function pad(n) { return String(n).padStart(2,'0'); }
function updateTimerDisplay() {
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  const el = document.getElementById('timer-disp');
  el.textContent = m + ':' + pad(s);
  el.className = 'timer-display' + (timerRunning ? ' running' : '');
}
function toggleTimer() {
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
    document.getElementById('timer-btn').textContent = 'Start pause';
  } else {
    startTimer();
  }
}
function startTimer() {
  clearInterval(timerInterval);
  timerSeconds = 0;
  timerRunning = true;
  document.getElementById('timer-btn').textContent = 'Stop';
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimerDisplay();
  }, 1000);
}
function resetTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = 0;
  document.getElementById('timer-btn').textContent = 'Start pause';
  updateTimerDisplay();
}
updateTimerDisplay();

// --- Page switching ---
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  event.target.classList.add('active');
}

// --- Install banner ---
function isStandalone() {
  return window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
}
if (!isStandalone() && !localStorage.getItem('banner-dismissed')) {
  document.getElementById('install-banner').style.display = 'block';
  document.querySelector('.install-close').addEventListener('click', () => {
    localStorage.setItem('banner-dismissed', '1');
  });
}

// --- Init ---
renderLog();
renderHistory();
renderStats();
</script>
</body>
</html>
